<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ハンデ収支</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0e10; --panel:#15161a; --panel2:#1b1d22; --hover:#212329;
    --line:#26292f; --line2:#33373f;
    --text:#eceae4; --muted:#8c8f97; --dim:#5f636b;
    --gold:#d8a94f; --gold2:#f0c46e; --gold-soft:rgba(216,169,79,.13);
    --win:#3ec28f; --win-soft:rgba(62,194,143,.12);
    --lose:#f06a62; --lose-soft:rgba(240,106,98,.12);
    --push:#a5aab3; --push-soft:rgba(165,170,179,.12);
    --warn:#f2a33a; --warn-soft:rgba(242,163,58,.13);
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Inter","Noto Sans JP","Hiragino Sans",sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums; font-family:"Inter","Noto Sans JP",sans-serif}
  .u{font-size:.72em; color:var(--muted); font-weight:600; margin-left:2px}
  .muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12px}
  .win{color:var(--win)} .lose{color:var(--lose)} .push{color:var(--push)}
  button{font-family:inherit; cursor:pointer}
  input,select,textarea{font-family:inherit}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; height:64px;
    display:flex; align-items:center; gap:28px; padding:0 28px;
    background:rgba(13,14,16,.86); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:180px}
  .logo{
    width:34px; height:34px; border-radius:9px; display:grid; place-items:center;
    background:linear-gradient(135deg,var(--gold2),var(--gold)); color:#1a1306;
    font-weight:900; font-size:16px;
  }
  .brand-title{font-weight:800; font-size:15px; letter-spacing:.02em}
  .brand-sub{font-size:10px; letter-spacing:.22em; color:var(--muted)}
  .tabs{display:flex; gap:4px; background:var(--panel); border:1px solid var(--line); padding:4px; border-radius:11px}
  .tabs button{
    border:0; background:transparent; color:var(--muted); font-weight:700; font-size:13px;
    padding:8px 18px; border-radius:8px;
  }
  .tabs button:hover{color:var(--text)}
  .tabs button.active{background:var(--panel2); color:var(--text); box-shadow:inset 0 0 0 1px var(--line2)}
  .top-actions{margin-left:auto; display:flex; gap:10px}

  /* ---------- buttons ---------- */
  .btn{
    border:1px solid var(--line2); background:var(--panel2); color:var(--text);
    border-radius:9px; padding:9px 16px; font-size:13px; font-weight:700;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    transition:background .12s,border-color .12s;
  }
  .btn:hover{background:var(--hover); border-color:#40444d}
  .btn:disabled{opacity:.45; cursor:default}
  .btn.primary{background:var(--gold); border-color:var(--gold); color:#1a1306}
  .btn.primary:hover{background:var(--gold2)}
  .btn.ghost{background:transparent}
  .btn.gold{background:var(--gold-soft); border-color:rgba(216,169,79,.4); color:var(--gold2)}
  .btn.gold:hover{background:rgba(216,169,79,.22)}
  .btn.danger{background:transparent; color:var(--lose); border-color:rgba(240,106,98,.35)}
  .btn.danger:hover{background:var(--lose-soft)}
  .btn.sm{padding:6px 11px; font-size:12px; border-radius:8px}
  .btn.active{background:var(--gold-soft); border-color:var(--gold); color:var(--gold2)}
  .icon-btn{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--line2);
    background:var(--panel2); color:var(--text); font-size:18px; display:grid; place-items:center;
  }
  .icon-btn:hover{background:var(--hover)}

  /* ---------- layout ---------- */
  main{padding:22px 28px 28px}
  .view{display:none} .view.active{display:block}
  .split{display:grid; grid-template-columns:minmax(440px,560px) 1fr; gap:20px; height:calc(100vh - 64px - 44px)}
  .pane{background:var(--panel); border:1px solid var(--line); border-radius:16px; display:flex; flex-direction:column; min-height:0; overflow:hidden}
  .pane-head{padding:16px 18px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:12px}
  .pane-body{padding:12px; overflow-y:auto; flex:1}
  .row{display:flex; align-items:center} .gap6{gap:6px} .gap8{gap:8px} .gap12{gap:12px}
  .spacer{flex:1}

  .weeknav{display:flex; align-items:center; gap:12px}
  .weeklabel{flex:1; text-align:center}
  #weekLabel{font-weight:800; font-size:16px}

  /* ---------- match list ---------- */
  .day-head{display:flex; align-items:center; gap:8px; padding:12px 8px 6px; font-size:12px; color:var(--muted); font-weight:700}
  .day-head .today{background:var(--gold-soft); color:var(--gold2); border-radius:5px; padding:1px 7px; font-size:11px}
  .mrow{
    display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center;
    padding:12px 14px; margin-bottom:6px; border-radius:11px; cursor:pointer;
    background:var(--panel2); border:1px solid transparent;
  }
  .mrow:hover{background:var(--hover)}
  .mrow.sel{border-color:var(--gold); background:#22201b}
  .mrow.needs{border-color:rgba(242,163,58,.45)}
  .mtitle{font-weight:800; font-size:14.5px}
  .msub{display:flex; flex-wrap:wrap; gap:6px; margin-top:5px; align-items:center; font-size:12px; color:var(--muted)}
  .hcb{display:inline-flex; align-items:center; gap:5px; background:var(--gold-soft); color:var(--gold2); border-radius:6px; padding:1px 8px; font-weight:700; font-size:11.5px}
  .hcb.none{background:var(--push-soft); color:var(--push)}
  .hcb.warn{background:var(--warn-soft); color:var(--warn)}
  .mright{text-align:right}
  .mscore{font-size:18px; font-weight:800}
  .mscore .sep{color:var(--dim); margin:0 4px}
  .tiny{font-size:11px; color:var(--muted)}
  .chip{display:inline-block; border-radius:999px; padding:2px 10px; font-size:11.5px; font-weight:700}
  .chip.open{background:var(--gold-soft); color:var(--gold2)}
  .chip.settled{background:var(--win-soft); color:var(--win)}
  .chip.cancelled{background:var(--lose-soft); color:var(--lose)}
  .chip.comp{background:#23262d; color:var(--muted)}
  .qfetch{margin-top:6px}

  .empty{padding:40px 20px; text-align:center; color:var(--muted)}
  .empty .big{font-size:34px; margin-bottom:8px}

  /* ---------- detail ---------- */
  .detail{padding:24px 26px; overflow-y:auto; flex:1}
  .d-top{display:flex; align-items:flex-start; gap:12px}
  .d-title{font-size:22px; font-weight:900; letter-spacing:.01em; margin:4px 0 0}
  .d-meta{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  .info-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:18px 0}
  .info{background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:11px 14px}
  .info .k{font-size:11px; color:var(--muted); font-weight:700; letter-spacing:.04em}
  .info .v{font-size:15px; font-weight:800; margin-top:2px}
  .card{background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px}
  .card-h{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  .card-h h3{margin:0; font-size:13px; letter-spacing:.06em; color:var(--muted); font-weight:800}
  .bigscore{display:flex; align-items:center; justify-content:center; gap:22px; padding:6px 0}
  .bigscore .t{font-size:15px; font-weight:800; min-width:110px}
  .bigscore .t.l{text-align:right} .bigscore .t.r{text-align:left}
  .bigscore .s{font-size:40px; font-weight:800}
  .bigscore .s .sep{color:var(--dim); margin:0 10px; font-weight:500}
  .banner{border-radius:10px; padding:12px 14px; font-weight:600; font-size:13px}
  .banner.cancel{background:var(--lose-soft); color:var(--lose)}
  .banner.warn{background:var(--warn-soft); color:var(--warn)}
  .score-in{display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:end}
  .score-in .vs{padding-bottom:12px; color:var(--dim); font-weight:800}

  /* ---------- forms ---------- */
  .field{display:flex; flex-direction:column; gap:6px}
  .field > span{font-size:11.5px; color:var(--muted); font-weight:700; letter-spacing:.03em}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%; background:#0f1013; border:1px solid var(--line2); color:var(--text);
    border-radius:9px; padding:10px 12px; font-size:14px; outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(216,169,79,.14)}
  input[type=date]{color-scheme:dark}
  input.invalid{border-color:var(--lose)}
  textarea{resize:vertical; min-height:180px; font-size:15px; line-height:1.7; font-family:"Noto Sans JP",monospace}
  .seg{display:inline-flex; background:#0f1013; border:1px solid var(--line2); border-radius:10px; padding:3px; gap:3px}
  .seg button{border:0; background:transparent; color:var(--muted); font-weight:700; font-size:12.5px; padding:7px 14px; border-radius:7px}
  .seg button.on{background:var(--gold); color:#1a1306}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px}

  /* ---------- tables ---------- */
  table.t{width:100%; border-collapse:collapse}
  table.t th{font-size:11px; color:var(--muted); font-weight:700; text-align:left; letter-spacing:.04em; padding:8px 10px; border-bottom:1px solid var(--line)}
  table.t td{padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
  table.t tr:last-child td{border-bottom:0}
  table.t .r{text-align:right}
  table.t tfoot td{border-top:1px solid var(--line2); font-weight:800}
  .side-tag{font-size:11.5px; border-radius:6px; padding:2px 8px; font-weight:700; background:#262930; color:var(--muted)}
  .side-tag.fav{background:var(--gold-soft); color:var(--gold2)}
  .res{font-weight:800; font-size:12.5px}

  .addbet{display:grid; grid-template-columns:1.3fr 1.4fr 1fr auto; gap:10px; align-items:end; margin-top:16px; padding-top:16px; border-top:1px dashed var(--line2)}
  .amt-chips{display:flex; gap:6px; margin-top:6px}
  .amt-chips button{border:1px solid var(--line2); background:transparent; color:var(--muted); border-radius:7px; padding:3px 8px; font-size:11.5px; font-weight:700}
  .amt-chips button:hover{color:var(--text); border-color:var(--gold)}

  /* ---------- summary ---------- */
  .wrap{max-width:1180px; margin:0 auto}
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:16px}
  .toolbar input[type=date]{width:160px; padding:7px 10px}
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px}
  .kpi .k{font-size:11.5px; color:var(--muted); font-weight:700; letter-spacing:.05em}
  .kpi .v{font-size:26px; font-weight:800; margin-top:4px}
  .ptable{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:6px 10px}
  .ptable tbody tr.main{cursor:pointer}
  .ptable tbody tr.main:hover td{background:var(--hover)}
  .ptable tr.sub td{background:#111215; padding:0}
  .ptable tr.sub table.t td, .ptable tr.sub table.t th{padding:8px 14px; font-size:12.5px}
  .caret{display:inline-block; width:14px; color:var(--dim); transition:transform .15s}
  tr.open .caret{transform:rotate(90deg)}
  .people-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px}
  .pcard{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; align-items:center; gap:8px}
  .pcard .name{font-weight:800; flex:1}

  /* ---------- modal ---------- */
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(3px); z-index:50; display:none; align-items:flex-start; justify-content:center; padding:5vh 20px; overflow-y:auto}
  .modal-bg.show{display:flex}
  .modal{width:min(1160px,100%); background:var(--panel); border:1px solid var(--line2); border-radius:18px; box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .modal.narrow{width:min(620px,100%)}
  .modal-h{display:flex; align-items:center; gap:12px; padding:18px 22px; border-bottom:1px solid var(--line)}
  .modal-h h2{margin:0; font-size:17px; font-weight:900}
  .modal-b{padding:20px 22px; display:flex; flex-direction:column; gap:16px}
  .modal-f{display:flex; align-items:center; gap:10px; padding:14px 22px; border-top:1px solid var(--line); background:#131418; border-radius:0 0 18px 18px}
  .preview td input{padding:6px 9px; font-size:13px; min-width:96px}
  .preview td.sched{min-width:170px}
  .preview td input.hc{width:80px; text-align:center; font-weight:800}
  .st{font-size:11.5px; font-weight:700; border-radius:6px; padding:2px 8px; white-space:nowrap}
  .st.new{background:var(--win-soft); color:var(--win)}
  .st.upd{background:var(--gold-soft); color:var(--gold2)}
  .st.skip{background:var(--push-soft); color:var(--push)}
  .st.bad{background:var(--lose-soft); color:var(--lose)}
  .gamepick{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px}
  .gamepick button{text-align:left; background:var(--panel2); border:1px solid var(--line2); color:var(--text); border-radius:10px; padding:10px 12px}
  .gamepick button:hover{border-color:var(--gold)}
  .gamepick button.on{border-color:var(--gold); background:#22201b}
  .gamepick .gt{font-weight:800}

  /* ---------- toast ---------- */
  #toastRoot{position:fixed; right:24px; bottom:24px; z-index:80; display:flex; flex-direction:column; gap:8px; align-items:flex-end}
  .toast{background:#24262c; border:1px solid var(--line2); color:var(--text); padding:11px 16px; border-radius:10px; font-weight:600; font-size:13px; max-width:440px; box-shadow:0 10px 30px rgba(0,0,0,.4); opacity:0; transform:translateY(8px); transition:all .2s}
  .toast.show{opacity:1; transform:none}
  .toast.ok{border-color:rgba(62,194,143,.5)}
  .toast.err{border-color:rgba(240,106,98,.6); color:#ffd1cd}

  @media (max-width:1000px){
    .topbar{gap:12px; padding:0 14px; height:auto; flex-wrap:wrap; padding-top:10px; padding-bottom:10px}
    main{padding:14px}
    .split{grid-template-columns:1fr; height:auto}
    .pane-body{max-height:none}
    .info-grid{grid-template-columns:1fr 1fr}
    .kpis{grid-template-columns:1fr 1fr}
    .addbet{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">H</div>
    <div><div class="brand-title">ハンデ収支</div><div class="brand-sub">HANDICAP LEDGER</div></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-view="matches" class="active">試合</button>
    <button data-view="summary">収支集計</button>
    <button data-view="people">参加者</button>
  </nav>
  <div class="top-actions">
    <button class="btn ghost" id="refreshBtn">↻ 更新</button>
    <button class="btn primary" id="openAddBtn">＋ 試合を追加</button>
  </div>
</header>

<main>
  <!-- ===== 試合 ===== -->
  <section class="view active" id="view-matches">
    <div class="split">
      <div class="pane">
        <div class="pane-head">
          <div class="weeknav" id="weekNav">
            <button class="icon-btn" id="weekPrev" title="前の週">‹</button>
            <div class="weeklabel"><div id="weekLabel">-</div><div class="tiny" id="weekSub"></div></div>
            <button class="icon-btn" id="weekNext" title="次の週">›</button>
          </div>
          <div class="row gap8">
            <button class="btn sm" id="weekToday">今週</button>
            <button class="btn sm" id="weekAll">すべて表示</button>
            <div class="spacer"></div>
            <button class="btn sm gold" id="bulkFetchBtn">⚾ 結果を一括取得</button>
          </div>
        </div>
        <div class="pane-body" id="matchList"><div class="empty">読み込み中…</div></div>
      </div>
      <div class="pane" id="detailPane">
        <div class="empty" style="margin:auto"><div class="big">⚾</div>左の一覧から試合を選んでください</div>
      </div>
    </div>
  </section>

  <!-- ===== 収支集計 ===== -->
  <section class="view" id="view-summary">
    <div class="wrap">
      <div class="toolbar">
        <div class="seg" id="periodSeg">
          <button data-p="week" class="on">今週</button>
          <button data-p="lastweek">先週</button>
          <button data-p="month">今月</button>
          <button data-p="lastmonth">先月</button>
          <button data-p="year">今年</button>
          <button data-p="all">全期間</button>
        </div>
        <div class="spacer"></div>
        <input type="date" id="sumStart"> <span class="muted">〜</span> <input type="date" id="sumEnd">
        <button class="btn sm" id="sumCustomBtn">この期間で集計</button>
      </div>
      <div class="row gap8" style="margin:0 4px 12px"><span id="sumLabel" style="font-weight:800"></span></div>
      <div class="kpis">
        <div class="kpi"><div class="k">賭金合計</div><div class="v num" id="kWager">-</div></div>
        <div class="kpi"><div class="k">戻し合計</div><div class="v num" id="kPayout">-</div></div>
        <div class="kpi"><div class="k">対象試合</div><div class="v num" id="kMatches">-</div></div>
        <div class="kpi"><div class="k">参加者</div><div class="v num" id="kPeople">-</div></div>
      </div>
      <div class="ptable">
        <table class="t">
          <thead><tr><th style="width:30%">参加者</th><th class="r">試合数</th><th class="r">勝 / 負 / 分</th><th class="r">賭金合計</th><th class="r">戻し合計</th><th class="r">収支</th></tr></thead>
          <tbody id="sumBody"><tr><td colspan="6" class="empty">期間を選んでください</td></tr></tbody>
        </table>
      </div>
      <div class="tiny" style="margin:10px 4px">※ 確定済みの試合のみ集計(試合中止は含みません)。行をクリックで試合ごとの内訳。</div>
    </div>
  </section>

  <!-- ===== 参加者 ===== -->
  <section class="view" id="view-people">
    <div class="wrap">
      <div class="toolbar">
        <input type="text" id="newPersonName" placeholder="新しい参加者の名前" style="max-width:320px">
        <button class="btn primary sm" id="addPersonBtn">＋ 追加</button>
        <div class="spacer"></div>
        <span class="tiny">名前変更は過去の記録にも反映 / 削除しても過去の記録は残ります</span>
      </div>
      <div class="people-list" id="peopleList"></div>
    </div>
  </section>
</main>

<!-- ===== 試合追加モーダル ===== -->
<div class="modal-bg" id="addModal">
  <div class="modal">
    <div class="modal-h">
      <h2>試合を追加</h2>
      <div class="seg" id="addTabSeg" style="margin-left:12px">
        <button data-t="line" class="on">LINEから貼り付け</button>
        <button data-t="single">1試合ずつ</button>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" data-close="addModal">×</button>
    </div>

    <!-- LINE -->
    <div class="modal-b" id="addLine">
      <div class="grid3">
        <label class="field"><span>試合日</span><input type="date" id="lineDate"></label>
        <label class="field"><span>大会</span>
          <div class="seg compSeg" data-target="lineComp"><button data-c="npb" class="on">プロ野球</button><button data-c="hsb_summer">夏の甲子園</button></div>
        </label>
        <label class="field"><span>勝ち配当率(%)</span><input type="number" id="lineRate" value="90" step="0.1"></label>
      </div>
      <div class="grid2" style="grid-template-columns:minmax(260px,1fr) 2.3fr; align-items:start">
        <label class="field"><span>LINEのハンデをそのまま貼り付け</span>
          <textarea id="lineText" placeholder="阪神<1.1>&#10;横浜&#10;&#10;ソフト<1.0>&#10;日ハム"></textarea>
          <span class="tiny" style="font-weight:500">＜ ＞ が付いている方をハンデ側として読み取ります。略称(横浜・日ハム・ソフト等)は自動で正式名に変換し、その日の日程と照合します。</span>
        </label>

const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const md = d => `${d.getMonth()+1}/${d.getDate()}`;
const mdw = d => `${md(d)}(${WD[d.getDay()]})`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };

function effDate(m){
  if (m.match_date) return parseYmd(m.match_date);

  }

}

/* ============================================================
   ハンデ計算(独自ルール)
   境界の1列だけ分計算、それ以外は丸勝ち/丸負け。
   ============================================================ */
function clean(x){ return Math.round(x * 1e6) / 1e6; }
function parseHC(raw){
  if (raw === null || raw === undefined) return null;
  let s = String(raw).trim()
    .replace(/[０-９．]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/[Hh]/g, '半').replace(/^[+\-−ー]/, '').replace(/\s/g,'');
  if (!s) return null;
  if (/^(なし|無し|ゼロ|pk|PK)$/.test(s)) s = '0';
  let m = s.match(/^(\d+)(?:\.0+)?半(\d+)?$/);
  if (m){ const n = +m[1]; const r = m[2] ? clean(parseFloat('0.'+m[2])) : 0; if (r >= 1) return null; return { n, r, isHalf:true }; }
  m = s.match(/^(\d+)(?:\.(\d+))?$/);
  if (m){ const n = +m[1]; const r = m[2] ? clean(parseFloat('0.'+m[2])) : 0; return { n, r, isHalf:false }; }
  return null;
}
function canonicalHC(p){
  if (p.r === 0) return p.isHalf ? `${p.n}半` : `${p.n}`;
  const digits = String(p.r).split('.')[1] || '0';
  return p.isHalf ? `${p.n}半${digits}` : `${p.n}.${digits}`;
}
const hasHc = m => m.hc !== null && m.hc !== undefined && m.hc !== '';
const isZeroHc = m => m.hc === '0';
function evaluate(p, margin){
  const b = p.isHalf ? p.n + 1 : p.n;
  if (margin < b) return { t:'lose', p:100 };
  if (margin > b) return { t:'win', p:100 };
  if (p.isHalf) return p.r === 0 ? { t:'win', p:100 } : { t:'win', p: clean((1 - p.r) * 100) };
  return p.r === 0 ? { t:'push' } : { t:'lose', p: clean(p.r * 100) };
}
function evaluateWithSpillover(p, margin){
  if (!p.isHalf && p.n === 0 && p.r > 0 && margin === 1) return { t:'win', p: clean((1 - p.r) * 100) };
  return evaluate(p, margin);
}
function outcomes(p, margin){
  const fav = evaluateWithSpillover(p, margin);
  const dog = fav.t === 'push' ? { t:'push' } : { t: fav.t === 'win' ? 'lose' : 'win', p: fav.p };
  return { fav, dog };
}
function profitOf(o, amount, rate){
  if (o.t === 'win') return amount * o.p / 100 * (rate / 100);
  if (o.t === 'lose') return -amount * o.p / 100;
  return 0;
}
function tagText(o){
  if (o.t === 'push') return '引き分け';
  const p = Number((o.p ?? 100).toFixed(2));
  if (o.t === 'win') return p === 100 ? '丸勝ち' : `分勝ち ${p}%`;
  return p === 100 ? '丸負け' : `分負け ${p}%`;
}
// 1件の賭けの結果 { label, t, profit, payout } / 未確定なら null
function betResult(m, b){
  const amt = Number(b.amount);
  if (m.cancelled) return { label:'中止(返金)', t:'push', profit:0, payout:amt };
  if (!m.settled || m.score_fav === null || m.score_dog === null) return null;
  const p = parseHC(m.hc); if (!p) return null;
  const { fav, dog } = outcomes(p, m.score_fav - m.score_dog);
  const o = b.side === 'fav' ? fav : dog;
  const profit = profitOf(o, amt, Number(m.payout_rate));
  return { label: tagText(o), t: o.t, profit, payout: amt + profit };
}

const TEAM_ALIASES = [
  ['巨人',      ['巨人','読売','ジャイアンツ','g']],
  ['ヤクルト',  ['ヤクルト','ヤク','スワローズ','燕']],

  ['ロッテ',    ['ロッテ','マリーンズ']],

];
function normTeam(s, comp){
  const t = String(s || '').trim().replace(/[\s　]+/g,'');
  if (comp !== 'npb') return t;
  const low = t.toLowerCase();
  for (const [name, al] of TEAM_ALIASES){ if (al.includes(low) || name.toLowerCase() === low) return name; }
  return t;
}
const teamEq = (a, b) => !!a && !!b && (a === b || a.includes(b) || b.includes(a));

/* ============================================================
   Supabase / Edge Function
   ============================================================ */
async function edge(params){
  const res = await fetch(`${SUPABASE_URL}/functions/v1/npb-day?${new URLSearchParams(params)}`, {
    headers: { Authorization: `Bearer ${SUPABASE_ANON_KEY}`, apikey: SUPABASE_ANON_KEY },
  });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
const dayCache = {};
async function getDay(date, comp){
  const key = comp + '|' + date;
  if (!dayCache[key]) dayCache[key] = edge({ date, competition: comp }).catch(e => { delete dayCache[key]; throw e; });
  return dayCache[key];
}
const lineScore = (gameId, comp) => edge({ gameId, competition: comp });

const state = {
  matches: [], participants: [], bets: {},
  weekStart: startOfWeek(new Date()), showAll: false, selectedId: null,
};

async function loadMatches(){
  const { data, error } = await sb.from('matches').select('*').order('created_at', { ascending:false }).limit(1000);
  if (error) throw error;
  state.matches = data || [];
}
async function loadParticipants(){
  const { data, error } = await sb.from('participants').select('id,name').order('name');
  if (error) throw error;
  state.participants = data || [];
}
async function fetchBets(ids){
  const out = [];
  for (let i = 0; i < ids.length; i += 80){
    const { data, error } = await sb.from('bets').select('*').in('match_id', ids.slice(i, i+80)).order('created_at');
    if (error) throw error;
    out.push(...data);
  }
  return out;
}
async function ensureBets(ids, force=false){
  const need = force ? ids : ids.filter(id => !state.bets[id]);
  if (!need.length) return false;
  const rows = await fetchBets(need);
  need.forEach(id => state.bets[id] = []);
  rows.forEach(b => (state.bets[b.match_id] ||= []).push(b));
  return true;
}
function upsertMatch(m){
  const i = state.matches.findIndex(x => x.id === m.id);
  if (i >= 0) state.matches[i] = m; else state.matches.unshift(m);
}
const getMatch = id => state.matches.find(m => m.id === id);

/* ============================================================
   確定・中止・取り消し
   ============================================================ */
async function settleMatch(m, sFav, sDog){
  const p = parseHC(m.hc);
  if (!p) throw new Error('ハンデが未登録です。編集からハンデを登録してください');
  await ensureBets([m.id], true);
  const bets = state.bets[m.id] || [];
  if (!bets.length) throw new Error('参加者がいません。先に参加者を追加してください');
  const { fav, dog } = outcomes(p, sFav - sDog);
  let total = 0;
  bets.forEach(b => total += profitOf(b.side === 'fav' ? fav : dog, Number(b.amount), Number(m.payout_rate)));
  const { data, error } = await sb.from('matches').update({
    score_fav: sFav, score_dog: sDog, settled: true, cancelled: false,
    settled_at: new Date().toISOString(), total_profit: Math.round(total), house_profit: Math.round(-total),
  }).eq('id', m.id).select().single();
  if (error) throw error;
  upsertMatch(data); return data;
}
async function cancelMatch(m){
  const { data, error } = await sb.from('matches').update({
    settled: true, cancelled: true, score_fav: null, score_dog: null,
    settled_at: new Date().toISOString(), total_profit: 0, house_profit: 0,
  }).eq('id', m.id).select().single();
  if (error) throw error;
  upsertMatch(data); return data;
}
async function unsettleMatch(m){
  const { data, error } = await sb.from('matches').update({
    settled: false, cancelled: false, score_fav: null, score_dog: null,
    settled_at: null, total_profit: null, house_profit: null,
  }).eq('id', m.id).select().single();
  if (error) throw error;
  upsertMatch(data); return data;
}

// Yahoo!スポーツから「9回終了時点」のスコアを取得
async function fetchResult(m){
  const comp = m.npb_competition || 'npb';
  const day = await getDay(fetchDate(m), comp);
  const cands = (day.games || []).filter(x =>
    (teamEq(x.homeTeam, m.npb_team_fav) && teamEq(x.awayTeam, m.npb_team_dog)) ||
    (teamEq(x.homeTeam, m.npb_team_dog) && teamEq(x.awayTeam, m.npb_team_fav)));
  if (!cands.length) return { status:'notfound' };

  // CS・日本シリーズは同じカードが連日続くので、試合ページに書かれた日付と
  // 登録日が一致する試合だけを採用する(別の日の得点で確定しないため)
  const want = parseYmd(fetchDate(m));
  let g = null, ls = null;
  for (const c of cands){
    const id = (c.gameUrl || '').match(/\/game\/(\d+)\//);
    if (!id) continue;
    let data = null;
    try { data = await lineScore(id[1], comp); } catch(_){ /* 試合前はページが無いことがある */ }
    const gd = data && data.gameDate;
    if (gd ? (gd.month === want.getMonth()+1 && gd.day === want.getDate()) : cands.length === 1){ g = c; ls = data; break; }
  }
  if (!g){
    // 日付が一致する試合ページがまだ無い = 試合前の可能性が高い
    if (cands.some(c => !c.finished && !c.cancelled)) return { status:'pending', text:'試合前' };
    return { status:'notfound' };
  }
  if (g.cancelled) return { status:'cancelled' };
  if (!g.finished) return { status:'pending', text: g.inProgress ? g.status : (g.startTime ? `試合前 ${g.startTime}〜` : '試合前') };
  if (!ls) return { status:'error', text:'得点表を取得できませんでした' };
  const favRow = (ls.rows || []).find(r => teamEq(r.team, m.npb_team_fav));
  const dogRow = (ls.rows || []).find(r => teamEq(r.team, m.npb_team_dog));
  if (!favRow || !dogRow) return { status:'error', text:'得点表のチーム名を照合できません' };
  return { status:'ok', fav: favRow.throughNineTotal, dog: dogRow.throughNineTotal };
}
async function fetchAndSettle(m){
  const r = await fetchResult(m);
  if (r.status === 'ok') { await settleMatch(m, r.fav, r.dog); return { ok:true, msg:`${r.fav} - ${r.dog} で確定しました(9回終了時点)` }; }
  if (r.status === 'cancelled') { await cancelMatch(m); return { ok:true, msg:'試合中止のため全額返金で確定しました' }; }
  if (r.status === 'pending') return { ok:false, msg:`まだ試合が終わっていません(${r.text})` };
  if (r.status === 'notfound') return { ok:false, msg:'その日の日程に該当する試合が見つかりません' };
  return { ok:false, msg: r.text || '取得できませんでした' };
}

  return '無題の試合';
}
function hcBadge(m){
  if (!hasHc(m)) return '<span class="hcb warn">⚠ ハンデ未登録</span>';
  if (isZeroHc(m)) return '<span class="hcb none">ハンデなし</span>';
  return `<span class="hcb">${m.npb_team_fav ? esc(m.npb_team_fav) + ' ' : 'HC '}${esc(m.hc)}</span>`;
}

  const s = state.weekStart, e = addDays(s, 6);
  $('#weekLabel').textContent = state.showAll ? 'すべての試合' : `${mdw(s)} 〜 ${mdw(e)}`;
  $('#weekSub').textContent = state.showAll ? '' : (ymd(s) === ymd(startOfWeek(new Date())) ? '今週' : `${s.getFullYear()}年`);
  $('#weekPrev').disabled = $('#weekNext').disabled = state.showAll;
  $('#weekAll').classList.toggle('active', state.showAll);
}
function renderMatchList(){
  renderWeekHead();
  const list = visibleMatches();
  const el = $('#matchList');

    el.innerHTML = `<div class="empty"><div class="big">📭</div>この期間に試合はありません<br><br><button class="btn primary sm" onclick="openAdd()">＋ 試合を追加</button></div>`;
    return;
  }
  const today = todayStr();
  let html = '', lastKey = '';
  for (const m of list){
    const d = effDate(m), key = ymd(d);
    if (key !== lastKey){
      const cnt = list.filter(x => ymd(effDate(x)) === key).length;
      html += `<div class="day-head">${mdw(d)} ${key === today ? '<span class="today">今日</span>' : ''}<span class="dim">· ${cnt}試合</span></div>`;
      lastKey = key;
    }
    const bets = state.bets[m.id];
    const stake = bets ? bets.reduce((s,b) => s + Number(b.amount), 0) : null;
    let right;
    if (m.cancelled) right = '<span class="chip cancelled">中止</span>';
    else if (m.settled) right = `<div class="mscore num">${m.score_fav}<span class="sep">-</span>${m.score_dog}</div>${m.npb_team_fav ? `<div class="tiny">${esc(m.npb_team_fav)} - ${esc(m.npb_team_dog)}</div>` : ''}`;

    html += `
      <div class="mrow ${state.selectedId === m.id ? 'sel' : ''} ${!hasHc(m) && !m.settled ? 'needs' : ''}" data-id="${m.id}">
        <div>

        </div>
        <div class="mright">${right}</div>
      </div>`;
  }
  el.innerHTML = html;
  const missing = list.map(m => m.id).filter(id => !state.bets[id]);
  if (missing.length) ensureBets(missing).then(ch => ch && renderMatchList()).catch(()=>{});

$('#bulkFetchBtn').onclick = async () => {
  const today = todayStr();
  const targets = state.matches.filter(m => !m.settled && canFetch(m) && fetchDate(m) <= today);
  if (!targets.length){ toast('結果取得できる未確定の試合はありません'); return; }
  const btn = $('#bulkFetchBtn'); btn.disabled = true;
  let done = 0, cancelled = 0, pending = 0, skipped = [];
  for (let i = 0; i < targets.length; i++){
    const m = targets[i];
    btn.textContent = `取得中… ${i+1}/${targets.length}`;
    try {
      const r = await fetchResult(m);
      if (r.status === 'cancelled'){ await cancelMatch(m); cancelled++; }
      else if (r.status === 'ok'){
        try { await settleMatch(m, r.fav, r.dog); done++; }
        catch(err){ skipped.push(`${displayTitle(m)}(${errMsg(err).split('。')[0]})`); }
      }
      else if (r.status === 'pending') pending++;
      else skipped.push(`${displayTitle(m)}(${r.status === 'notfound' ? '日程に見つからず' : r.text})`);
    } catch(err){ skipped.push(`${displayTitle(m)}(${errMsg(err)})`); }
  }
  btn.disabled = false; btn.textContent = '⚾ 結果を一括取得';
  await ensureBets(targets.map(m => m.id), true).catch(()=>{});
  renderMatchList(); renderDetail();
  toast(`確定 ${done}件 / 中止 ${cancelled}件 / 試合前・試合中 ${pending}件` + (skipped.length ? ` / 未処理 ${skipped.length}件` : ''), 'ok', 6000);

};

async function addBet(m){
  const pick = $('#bPick').value;
  const name = (pick === '__new' ? $('#bNew').value : pick).trim();
  const amount = Number($('#bAmt').value);
  const side = $('#bSide button.on').dataset.s;
  if (!name){ toast('参加者を選んでください', 'err'); return; }
  if (!(amount > 0)){ $('#bAmt').classList.add('invalid'); toast('賭金を入力してください', 'err'); return; }
  $('#bAdd').disabled = true;
  try {
    const pid = await findOrCreateParticipant(name);
    const { error } = await sb.from('bets').insert({ match_id: m.id, name, side, amount, participant_id: pid });
    if (error) throw error;
    await ensureBets([m.id], true);
    renderDetail(); renderMatchList();
    toast(`${name} を追加しました`, 'ok', 1800);
    const p2 = $('#bPick'); if (p2){ p2.value = ''; }
  } catch(err){ handleDbError(err, '追加に失敗'); $('#bAdd') && ($('#bAdd').disabled = false); }
}
async function findOrCreateParticipant(name){
  const ex = state.participants.find(p => p.name === name);
  if (ex) return ex.id;
  const { data: found, error: e1 } = await sb.from('participants').select('id,name').eq('name', name).maybeSingle();
  if (e1) throw e1;
  if (found){ state.participants.push(found); return found.id; }
  const { data, error } = await sb.from('participants').insert({ name }).select().single();
  if (error) throw error;
  state.participants.push(data); state.participants.sort((a,b) => a.name.localeCompare(b.name, 'ja'));
  return data.id;
}

  if (!confirm(`「${displayTitle(m)}」を削除しますか？\n参加者の記録も一緒に削除され、元に戻せません。`)) return;

    state.matches = state.matches.filter(x => x.id !== m.id); delete state.bets[m.id];

    renderMatchList(); renderDetail(); toast('削除しました', 'ok');

/* ---------- LINE 貼り付け ---------- */
const MARK = /[<＜〈《]\s*([^<>＜＞〈〉《》]*?)\s*[>＞〉》]/;
const NOISE = /(\d{1,2}\s*[\/／月]\s*\d{1,2})|[:：]|ハンデ|本日|今日|明日|試合|^[-ー=＝*＊・〜~]+$/;
function parseLinePaste(text){
  const pairs = [];
  const blocks = String(text || '').replace(/\r/g,'').split(/\n[ \t　]*\n/);
  for (const blk of blocks){
    const lines = blk.split('\n').map(s => s.trim()).filter(Boolean);
    const rest = [];
    for (const ln of lines){
      const m = ln.match(MARK);
      if (m){
        const left = ln.slice(0, m.index).trim(), right = ln.slice(m.index + m[0].length).trim();
        if (left && right){ pairs.push({ fav:left, dog:right, hc:m[1] }); continue; }
      }
      rest.push(ln);
    }
    const cand = rest.filter(ln => MARK.test(ln) || !NOISE.test(ln));
    for (let i = 0; i + 1 < cand.length; i += 2){
      const a = cand[i], b = cand[i+1];
      const ma = a.match(MARK), mb = b.match(MARK);
      const ta = a.replace(MARK,'').trim(), tb = b.replace(MARK,'').trim();
      if (mb && !ma) pairs.push({ fav:tb, dog:ta, hc:mb[1] });
      else pairs.push({ fav:ta, dog:tb, hc: ma ? ma[1] : '' });
    }
  }
  return pairs;
}
let lineRows = [];
function findExisting(date, a, b){
  return state.matches.find(m => ymd(effDate(m)) === date && (
    (teamEq(m.npb_team_fav, a) && teamEq(m.npb_team_dog, b)) || (teamEq(m.npb_team_fav, b) && teamEq(m.npb_team_dog, a)) ||
    (!m.npb_team_fav && (m.name || '').includes(a) && (m.name || '').includes(b))));
}
function computeLineRow(r, date, comp, games){
  r.favN = normTeam(r.fav, comp); r.dogN = normTeam(r.dog, comp);
  const raw = String(r.hc || '').trim();
  r.p = raw ? parseHC(raw) : null;
  r.hcBad = !!raw && !r.p;
  r.hcCanon = r.p ? canonicalHC(r.p) : null;
  r.game = (games || []).find(g =>
    (teamEq(g.homeTeam, r.favN) && teamEq(g.awayTeam, r.dogN)) || (teamEq(g.homeTeam, r.dogN) && teamEq(g.awayTeam, r.favN))) || null;
  if (r.game){
    r.favFinal = teamEq(r.game.homeTeam, r.favN) ? r.game.homeTeam : r.game.awayTeam;
    r.dogFinal = r.favFinal === r.game.homeTeam ? r.game.awayTeam : r.game.homeTeam;
  } else { r.favFinal = r.favN; r.dogFinal = r.dogN; }
  r.existing = findExisting(date, r.favFinal, r.dogFinal) || null;
  if (r.hcBad) r.action = 'bad';
  else if (!r.favFinal || !r.dogFinal) r.action = 'bad';
  else if (r.existing && r.existing.settled) r.action = 'locked';
  else if (r.existing && r.existing.hc === r.hcCanon && teamEq(r.existing.npb_team_fav, r.favFinal)) r.action = 'same';
  else if (r.existing) r.action = 'update';
  else r.action = 'new';
}
let lineTimer = null, lineGames = null;
async function refreshLinePreview(refetch=false){
  const date = $('#lineDate').value, comp = compOf('lineComp');
  const parsed = parseLinePaste($('#lineText').value);
  // 既存の行の編集内容(チェック)を可能な限り保持
  lineRows = parsed.map((p, i) => ({ include: lineRows[i] ? lineRows[i].include : true, ...p }));
  if (refetch || lineGames === null || lineGames.key !== comp + date){
    lineGames = { key: comp + date, games: null, error: null };
    if (date && lineRows.length){
      renderLinePreview();
      try { lineGames.games = (await getDay(date, comp)).games || []; }
      catch(e){ lineGames.error = errMsg(e); lineGames.games = []; }
    }
  }
  renderLinePreview();
}
function renderLinePreview(){
  const date = $('#lineDate').value, comp = compOf('lineComp');
  const box = $('#linePreview');
  if (!lineRows.length){ box.innerHTML = '<div class="empty">貼り付けると自動で読み取ります</div>'; updateAddFoot(); return; }
  lineRows.forEach(r => computeLineRow(r, date, comp, lineGames && lineGames.games));
  const ST = { new:['新規','new'], update:['ハンデ更新','upd'], same:['登録済み','skip'], locked:['確定済み','skip'], bad:['要修正','bad'] };
  box.innerHTML = `
    ${lineGames && lineGames.games === null ? '<div class="tiny" style="margin-bottom:8px">日程を照合中…</div>' : ''}
    ${lineGames && lineGames.error ? `<div class="tiny" style="color:var(--warn); margin-bottom:8px">日程を取得できませんでした(${esc(lineGames.error)})。手動試合として登録されます。</div>` : ''}
    <table class="t preview">
      <thead><tr><th></th><th>ハンデ側</th><th style="text-align:center">ハンデ</th><th>相手側</th><th></th><th>日程照合</th><th>状態</th></tr></thead>
      <tbody>${lineRows.map((r,i) => `
        <tr>
          <td><input type="checkbox" data-i="${i}" data-k="include" ${r.include && ['new','update'].includes(r.action) ? 'checked' : ''} ${['new','update'].includes(r.action) ? '' : 'disabled'}></td>
          <td><input type="text" data-i="${i}" data-k="fav" value="${esc(r.favFinal)}"></td>
          <td><input type="text" class="hc ${r.hcBad ? 'invalid' : ''}" data-i="${i}" data-k="hc" value="${esc(r.hc)}" placeholder="未登録"></td>
          <td><input type="text" data-i="${i}" data-k="dog" value="${esc(r.dogFinal)}"></td>
          <td><button class="btn sm ghost" data-swap="${i}" title="ハンデ側を入れ替え">⇄</button></td>
          <td class="tiny sched">${r.game ? `<span class="win">✓</span> ${esc(r.game.homeTeam)} vs ${esc(r.game.awayTeam)}${r.game.venue ? ' · ' + esc(r.game.venue) : ''}` : (lineGames && lineGames.games === null ? '…' : '<span class="dim">日程なし(手動)</span>')}</td>
          <td><span class="st ${ST[r.action][1]}">${ST[r.action][0]}</span></td>
        </tr>`).join('')}</tbody>
    </table>`;
  updateAddFoot();
}
$('#lineText').addEventListener('input', () => { clearTimeout(lineTimer); lineTimer = setTimeout(() => refreshLinePreview(), 350); });
$('#lineDate').addEventListener('change', () => refreshLinePreview(true));
$('#linePreview').addEventListener('change', e => {
  const i = e.target.dataset.i, k = e.target.dataset.k; if (i === undefined) return;
  const r = lineRows[+i];
  if (k === 'include') r.include = e.target.checked;
  else r[k] = e.target.value;
  renderLinePreview();
});
$('#linePreview').addEventListener('click', e => {
  const s = e.target.closest('[data-swap]'); if (!s) return;
  const r = lineRows[+s.dataset.swap]; [r.fav, r.dog] = [r.dogFinal, r.favFinal];
  renderLinePreview();
});
function updateAddFoot(){
  const btn = $('#addSubmitBtn'), note = $('#addFootNote');
  if (addTab === 'line'){
    const sel = lineRows.filter(r => r.include && ['new','update'].includes(r.action));
    const nNew = sel.filter(r => r.action === 'new').length, nUpd = sel.filter(r => r.action === 'update').length;
    btn.textContent = sel.length ? `${sel.length}件を登録` : '登録する';
    btn.disabled = !sel.length;
    note.textContent = lineRows.length ? `新規 ${nNew}件 / ハンデ更新 ${nUpd}件` : '';
  } else {
    btn.textContent = '登録する'; btn.disabled = false; note.textContent = '';
  }
}

/* ---------- 1試合ずつ ---------- */

$('#sName').addEventListener('input', () => sNameDirty = $('#sName').value.trim() !== '');
$$('#sSideSeg button').forEach(b => b.onclick = () => {

$('#sSearchBtn').onclick = async () => {

/* ---------- 登録 ---------- */
$('#addSubmitBtn').onclick = async () => {
  const btn = $('#addSubmitBtn'); btn.disabled = true;
  try {
    if (addTab === 'line') await submitLine(); else await submitSingle();
  } finally { btn.disabled = false; updateAddFoot(); }
};
async function submitLine(){
  const date = $('#lineDate').value, comp = compOf('lineComp');
  const rate = Number($('#lineRate').value) || 90;
  if (!date){ toast('試合日を選んでください', 'err'); return; }
  const sel = lineRows.filter(r => r.include && ['new','update'].includes(r.action));
  const inserts = sel.filter(r => r.action === 'new').map(r => ({
    name: `${md(parseYmd(date))} ${r.game ? `${r.game.homeTeam} vs ${r.game.awayTeam}` : `${r.favFinal} vs ${r.dogFinal}`}`,
    hc: r.hcCanon, memo: null, payout_rate: rate, settled: false, match_date: date,
    npb_date: r.game ? date : null, npb_team_fav: r.favFinal, npb_team_dog: r.dogFinal, npb_competition: comp,
  }));
  try {
    if (inserts.length){ const { error } = await sb.from('matches').insert(inserts); if (error) throw error; }
    for (const r of sel.filter(r => r.action === 'update')){
      const { error } = await sb.from('matches').update({ hc: r.hcCanon, npb_team_fav: r.favFinal, npb_team_dog: r.dogFinal }).eq('id', r.existing.id);
      if (error) throw error;
    }
    await loadMatches();
    state.showAll = false; state.weekStart = startOfWeek(parseYmd(date));
    hideModal('addModal');
    $('#lineText').value = ''; lineRows = []; renderLinePreview();
    renderMatchList();
    toast(`登録しました(新規 ${inserts.length}件 / 更新 ${sel.length - inserts.length}件)`, 'ok');
  } catch(err){ handleDbError(err, '登録に失敗'); }
}
async function submitSingle(){
  const date = $('#sDate').value || null, comp = compOf('sComp');
  const home = normTeam($('#sHome').value, comp), away = normTeam($('#sAway').value, comp);
  const side = $('#sSideSeg button.on').dataset.s;
  const hcRaw = side === 'none' ? '0' : $('#sHc').value.trim();
  let hc = null;
  if (hcRaw){ const p = parseHC(hcRaw); if (!p){ $('#sHc').classList.add('invalid'); toast('ハンデの表記が正しくありません', 'err'); return; } hc = canonicalHC(p); }
  const name = $('#sName').value.trim() || (home || away ? `${date ? md(parseYmd(date)) + ' ' : ''}${home} vs ${away}` : '');
  if (!name){ toast('チーム名か試合名を入力してください', 'err'); return; }
  const fav = side === 'away' ? away : home, dog = side === 'away' ? home : away;
  // 日程と照合できれば自動連携(結果取得が使えるようになる)
  let npbDate = null;
  if (date && home && away){
    try {
      const games = (await getDay(date, comp)).games || [];
      if (games.some(g => (teamEq(g.homeTeam, home) && teamEq(g.awayTeam, away)) || (teamEq(g.homeTeam, away) && teamEq(g.awayTeam, home)))) npbDate = date;
    } catch(_){}
  }
  try {
    const { data, error } = await sb.from('matches').insert({
      name, hc, memo: $('#sMemo').value.trim() || null, payout_rate: Number($('#sRate').value) || 90, settled: false,
      match_date: date, npb_date: npbDate, npb_team_fav: fav || null, npb_team_dog: dog || null, npb_competition: comp,
    }).select().single();
    if (error) throw error;
    upsertMatch(data);
    if (date){ state.showAll = false; state.weekStart = startOfWeek(parseYmd(date)); }
    hideModal('addModal');
    ['sHome','sAway','sHc','sMemo','sName'].forEach(id => $('#'+id).value = ''); sNameDirty = false; $('#sGames').innerHTML = '';
    selectMatch(data.id);
    toast(npbDate ? '登録しました(日程と連携済み・結果取得が使えます)' : '登録しました', 'ok');
  } catch(err){ handleDbError(err, '登録に失敗'); }
}

/* ============================================================
   収支集計
   ============================================================ */
let sumPeriod = 'week';
function periodRange(p){
  const now = new Date(); const t = ymd(now);
  if (p === 'week'){ const s = startOfWeek(now); return [ymd(s), ymd(addDays(s,6)), `今週 ${mdw(s)}〜${mdw(addDays(s,6))}`]; }
  if (p === 'lastweek'){ const s = addDays(startOfWeek(now), -7); return [ymd(s), ymd(addDays(s,6)), `先週 ${mdw(s)}〜${mdw(addDays(s,6))}`]; }
  if (p === 'month'){ const s = new Date(now.getFullYear(), now.getMonth(), 1), e = new Date(now.getFullYear(), now.getMonth()+1, 0); return [ymd(s), ymd(e), `${now.getMonth()+1}月`]; }
  if (p === 'lastmonth'){ const s = new Date(now.getFullYear(), now.getMonth()-1, 1), e = new Date(now.getFullYear(), now.getMonth(), 0); return [ymd(s), ymd(e), `${s.getMonth()+1}月`]; }
  if (p === 'year'){ return [`${now.getFullYear()}-01-01`, `${now.getFullYear()}-12-31`, `${now.getFullYear()}年`]; }
  return [null, null, '全期間'];
}
async function runSummary(start, end, label){
  $('#sumLabel').textContent = label;
  const body = $('#sumBody');
  body.innerHTML = '<tr><td colspan="6" class="empty">集計中…</td></tr>';
  const ms = state.matches.filter(m => {
    if (!m.settled || m.cancelled) return false;
    const d = ymd(effDate(m)); return (!start || d >= start) && (!end || d <= end);
  });
  try { await ensureBets(ms.map(m => m.id)); } catch(err){ handleDbError(err, '集計に失敗'); return; }
  const people = {}; let wager = 0, payout = 0;
  for (const m of ms){
    for (const b of (state.bets[m.id] || [])){
      const r = betResult(m, b); if (!r) continue;
      const key = b.participant_id || 'n:' + b.name;
      const P = people[key] ||= { name: b.name, n:0, w:0, l:0, d:0, stake:0, payout:0, profit:0, rows:[] };
      P.n++; P.stake += Number(b.amount); P.payout += r.payout; P.profit += r.profit;
      if (r.profit > 0) P.w++; else if (r.profit < 0) P.l++; else P.d++;
      P.rows.push({ m, b, r });
      wager += Number(b.amount); payout += r.payout;
    }
  }
  const list = Object.values(people).sort((a,b) => b.profit - a.profit);
  $('#kWager').innerHTML = zeny(wager); $('#kPayout').innerHTML = zeny(payout);
  $('#kMatches').innerHTML = `${ms.length}<span class="u">試合</span>`; $('#kPeople').innerHTML = `${list.length}<span class="u">名</span>`;
  if (!list.length){ body.innerHTML = '<tr><td colspan="6" class="empty">この期間に確定した試合はありません</td></tr>'; return; }
  body.innerHTML = list.map((P,i) => `
    <tr class="main" data-i="${i}">
      <td style="font-weight:800"><span class="caret">▶</span> ${esc(P.name)}</td>
      <td class="r num">${P.n}</td>
      <td class="r num"><span class="win">${P.w}</span> / <span class="lose">${P.l}</span> / <span class="push">${P.d}</span></td>
      <td class="r">${zeny(P.stake)}</td>
      <td class="r">${zeny(P.payout)}</td>
      <td class="r" style="font-weight:800; font-size:15px"><span class="${cls(P.profit)}">${zeny(P.profit, true)}</span></td>
    </tr>
    <tr class="sub" data-sub="${i}" style="display:none"><td colspan="6">
      <table class="t"><thead><tr><th>日付</th><th>試合</th><th>賭けた側</th><th class="r">結果</th><th class="r">賭金</th><th class="r">戻し</th><th class="r">収支</th></tr></thead><tbody>
      ${P.rows.sort((a,b) => effDate(a.m) - effDate(b.m)).map(x => `<tr>
        <td class="muted">${mdw(effDate(x.m))}</td>
        <td>${esc(displayTitle(x.m))} <span class="dim num">${x.m.score_fav}-${x.m.score_dog}</span></td>
        <td><span class="side-tag ${x.b.side === 'fav' ? 'fav' : ''}">${esc(sideName(x.m, x.b.side))}</span></td>
        <td class="r"><span class="res ${x.r.t}">${esc(x.r.label)}</span></td>
        <td class="r">${zeny(Number(x.b.amount))}</td>
        <td class="r">${zeny(x.r.payout)}</td>
        <td class="r"><span class="${cls(x.r.profit)}" style="font-weight:800">${zeny(x.r.profit, true)}</span></td>
      </tr>`).join('')}
      </tbody></table></td></tr>`).join('');
}
$('#sumBody').addEventListener('click', e => {
  const tr = e.target.closest('tr.main'); if (!tr) return;
  const sub = $(`tr[data-sub="${tr.dataset.i}"]`);
  const open = sub.style.display === 'none';
  sub.style.display = open ? '' : 'none'; tr.classList.toggle('open', open);
});
$$('#periodSeg button').forEach(b => b.onclick = () => {
  $$('#periodSeg button').forEach(x => x.classList.toggle('on', x === b));
  sumPeriod = b.dataset.p; const [s,e,l] = periodRange(sumPeriod); runSummary(s,e,l);
});
$('#sumCustomBtn').onclick = () => {
  const s = $('#sumStart').value || null, e = $('#sumEnd').value || null;
  if (!s && !e){ toast('開始日か終了日を指定してください', 'err'); return; }
  $$('#periodSeg button').forEach(x => x.classList.remove('on'));
  runSummary(s, e, `${s ? mdw(parseYmd(s)) : ''} 〜 ${e ? mdw(parseYmd(e)) : ''}`);
};

/* ============================================================
   参加者
   ============================================================ */
function renderPeople(){
  const el = $('#peopleList');
  if (!state.participants.length){ el.innerHTML = '<div class="empty">まだ参加者がいません</div>'; return; }
  el.innerHTML = state.participants.map(p => `
    <div class="pcard"><span class="name">${esc(p.name)}</span>
      <button class="btn sm" data-ren="${p.id}">名前変更</button>
      <button class="btn sm danger" data-del="${p.id}">削除</button></div>`).join('');
}
$('#peopleList').addEventListener('click', async e => {
  const ren = e.target.closest('[data-ren]'), del = e.target.closest('[data-del]');
  const p = state.participants.find(x => x.id === (ren || del)?.dataset[ren ? 'ren' : 'del']);
  if (!p) return;
  if (ren){
    const nn = (prompt('新しい名前', p.name) || '').trim();
    if (!nn || nn === p.name) return;
    try {
      let { error } = await sb.from('participants').update({ name: nn }).eq('id', p.id); if (error) throw error;
      ({ error } = await sb.from('bets').update({ name: nn }).eq('participant_id', p.id)); if (error) throw error;
      p.name = nn; Object.values(state.bets).flat().forEach(b => { if (b.participant_id === p.id) b.name = nn; });
      renderPeople(); renderDetail(); toast('名前を変更しました(過去の記録も更新)', 'ok');
    } catch(err){ handleDbError(err, '変更に失敗'); }
  } else {
    if (!confirm(`「${p.name}」を参加者リストから削除しますか？\n過去の試合の記録は残ります。`)) return;
    try {
      const { error } = await sb.from('participants').delete().eq('id', p.id); if (error) throw error;
      state.participants = state.participants.filter(x => x.id !== p.id); renderPeople(); toast('削除しました', 'ok');
    } catch(err){ handleDbError(err, '削除に失敗'); }
  }
});
$('#addPersonBtn').onclick = async () => {
  const n = $('#newPersonName').value.trim(); if (!n) return;
  try { await findOrCreateParticipant(n); $('#newPersonName').value = ''; renderPeople(); toast(`${n} を追加しました`, 'ok'); }
  catch(err){ handleDbError(err, '追加に失敗'); }
};
$('#newPersonName').addEventListener('keydown', e => { if (e.key === 'Enter') $('#addPersonBtn').click(); });

/* ============================================================
   画面切り替え・モーダル・起動
   ============================================================ */
$$('#tabs button').forEach(b => b.onclick = () => {
  $$('#tabs button').forEach(x => x.classList.toggle('active', x === b));
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + b.dataset.view));
  if (b.dataset.view === 'summary'){ const [s,e,l] = periodRange(sumPeriod); runSummary(s,e,l); }
  if (b.dataset.view === 'people') renderPeople();
});
function showModal(id){ $('#'+id).classList.add('show'); }
function hideModal(id){ $('#'+id).classList.remove('show'); }
$$('[data-close]').forEach(b => b.onclick = () => hideModal(b.dataset.close));
$$('.modal-bg').forEach(bg => bg.addEventListener('mousedown', e => { if (e.target === bg) hideModal(bg.id); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') $$('.modal-bg.show').forEach(m => hideModal(m.id)); });

async function boot(){
  if (!sb){ toast('Supabaseの読み込みに失敗しました。通信環境を確認してください', 'err', 8000); return; }
  try {
    await Promise.all([loadMatches(), loadParticipants()]);
    renderMatchList();
  } catch(err){
    $('#matchList').innerHTML = `<div class="empty">読み込みに失敗しました<br><span class="tiny">${esc(errMsg(err))}</span><br><br><span class="tiny">Supabaseが一時停止していないか確認してください</span></div>`;
  }
}
$('#refreshBtn').onclick = async () => {
  Object.keys(state.bets).forEach(k => delete state.bets[k]);
  Object.keys(dayCache).forEach(k => delete dayCache[k]);
  await boot(); renderDetail();
  if ($('#view-people').classList.contains('active')) renderPeople();
  toast('最新の状態に更新しました', 'ok', 1500);
};
boot();
